name: Release

on:
    push:
        branches:
            - main
    workflow_dispatch: {}

concurrency:
    group: npm-release-main
    cancel-in-progress: false

permissions:
    contents: write
    id-token: write
    pull-requests: write

jobs:
    release:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  registry-url: "https://registry.npmjs.org"
                  package-manager-cache: false

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.0

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Check
              run: |
                  bun run typecheck
                  bun run lint
                  bun run test

            - name: Build
              run: bun run build
              env:
                  NODE_ENV: production

            - name: Create release pull request or publish to npm
              uses: changesets/action@v2.1.2
              with:
                  version-script: bun run version-packages
                  publish-script: bun run release
                  commit-message: "chore(release): version package"
                  pr-title: "chore(release): version package"
                  create-github-releases: true
